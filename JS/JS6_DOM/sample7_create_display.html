<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
        }
    </style>
</head>

<body>
    <!-- <button onclick="displayUsers()">Display Users</button> -->
    <form action="">
        <label for="userid">ID</label>
        <input type="text" name="" id="userid"> <br>
        <label for="name">Name</label>
        <input type="text" name="" id="name"> <br>
        <button type="button" onclick="readDataFromForm()">Add User</button>
    </form>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
                <th>Profession</th>
                <th>Salary</th>
                <th>Is Active</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        // for (i = 0; i < 10; i++) {
        //     var para = document.createElement("p");
        //     var node = document.createTextNode("This is Paragraph " + i);
        //     para.appendChild(node);
        //     // para.innerHTML = "Create an Element in DOM !!!"
        //     document.body.appendChild(para);
        // }

        var users = []
        function readDataFromForm() {
            var user = {};
            var myId = document.getElementById("userid").value;
            var myname = document.getElementById("name").value;

            user.id = myId;
            user.name = myname;
            users.push(user);
            displayUsers();
        }
        function displayUsers() {
            for (i = 0; i < users.length; i++) {
                var myTr = document.createElement("tr");
                myTr.innerHTML = `
            <td>${users[i].id}</td>
            <td>${users[i].name}</td>
            <td>${users[i].age}</td>
            <td>${users[i].city}</td>
            <td>${users[i].profession}</td>
            <td>${users[i].salary}</td>
            <td>${users[i].isActive}</td>
            `
                document.querySelector("tbody").appendChild(myTr)
            }
        }
    </script>
</body>

</html>
